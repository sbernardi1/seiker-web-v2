<main id="contenido">
  <section class="banner banner--liso">

    <div class="wrap">
      <nav class="crumbs" aria-label="Ruta"><ol><li><a href="index.html">Inicio</a></li><li aria-current="page">Productos</li></ol></nav>
      <p class="eyebrow">Productos y soluciones</p>
      <h1 class="h1">Buscador de productos</h1>
      <p>Encontrá la solución indicada para tu cultivo o tu instalación. Filtrá por línea, cultivo y tipo de aplicación.</p>

  <section class="sec" style="padding-top:48px">
    <div class="wrap">
      <div class="finder" id="finder">
        <aside class="fl-side" aria-label="Filtros">
          <div class="fl-side-h">
            <h2>Filtros</h2>
            <button class="ib fl-cerrar" type="button" data-filtros aria-label="Cerrar filtros"><i data-ico="cerrar"></i></button>
          </div>
          <div id="fl-campos"></div>
          <button class="btn btn--line btn--sm" type="button" data-limpiar style="margin-top:22px">Limpiar filtros</button>
        </aside>

        <div class="fl-main">
          <form class="fl-top" id="fl-form" role="search">
            <button type="button" class="btn btn--line btn--sm fl-btn" data-filtros>Filtros <span class="fl-badge" id="fl-badge" hidden></span></button>
            <label class="fl-q"><i data-ico="lupa"></i>
              <input id="fl-q" type="search" placeholder="Buscar por nombre, nutriente o cultivo" aria-label="Buscar productos" /></label>
          </form>
          <div class="sec-h--row" style="display:flex;margin-bottom:14px">
            <h2 class="h3" id="fl-titulo">Todos los productos</h2>
            <span class="fl-n" id="fl-n" aria-live="polite"></span>
          </div>
          <div class="fl-chips" id="fl-chips"></div>
          <div class="pgrid" id="fl-grid"></div>
        </div>
      </div>
    </div>
